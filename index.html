<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0">

<title>CBRND Location Sharing</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    color:#fff;

    background:
    radial-gradient(
        circle at top,
        #172554,
        #020617 50%,
        #000
    );

}

.card{

    width:100%;

    max-width:500px;

    padding:30px;

    text-align:center;

    border-radius:25px;

    background:
    rgba(15,23,42,.95);

    border:
    1px solid
    rgba(56,189,248,.35);

    box-shadow:
    0 0 45px
    rgba(14,165,233,.15);

}

.logo{

    width:85px;

    height:85px;

    margin:
    0 auto 18px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    font-size:40px;

    background:
    linear-gradient(
        135deg,
        #06b6d4,
        #2563eb,
        #7c3aed
    );

    box-shadow:
    0 0 35px
    rgba(34,211,238,.35);

}

h1{

    font-size:27px;

    margin-bottom:10px;

}

.subtitle{

    color:#94a3b8;

    line-height:1.6;

    margin-bottom:22px;

}

.info{

    padding:15px;

    margin-bottom:15px;

    border-radius:13px;

    background:#020617;

    border:1px solid #1e3a5f;

    text-align:left;

}

.info-title{

    color:#64748b;

    font-size:11px;

    margin-bottom:5px;

    text-transform:uppercase;

}

.info-value{

    color:#67e8f9;

    font-weight:bold;

    word-break:break-all;

}

.permission-button{

    width:100%;

    padding:15px;

    border:0;

    border-radius:13px;

    color:#fff;

    font-weight:bold;

    font-size:16px;

    background:
    linear-gradient(
        135deg,
        #06b6d4,
        #2563eb
    );

    box-shadow:
    0 8px 25px
    rgba(37,99,235,.25);

}

.stop-button{

    width:100%;

    margin-top:10px;

    padding:13px;

    border:0;

    border-radius:12px;

    background:#7f1d1d;

    color:#fecaca;

    font-weight:bold;

    display:none;

}

.status{

    margin-top:18px;

    padding:13px;

    border-radius:11px;

    display:none;

    font-size:14px;

}

.status.waiting{

    display:block;

    background:#713f12;

    color:#fef3c7;

}

.status.success{

    display:block;

    background:#14532d;

    color:#bbf7d0;

}

.status.error{

    display:block;

    background:#7f1d1d;

    color:#fecaca;

}

.details{

    margin-top:15px;

    display:none;

    text-align:left;

}

.detail{

    display:flex;

    justify-content:space-between;

    gap:15px;

    padding:9px 0;

    border-bottom:1px solid #172033;

    font-size:13px;

}

.detail span:first-child{

    color:#64748b;

}

.detail span:last-child{

    color:#fff;

    font-weight:bold;

}

.footer{

    margin-top:20px;

    color:#475569;

    font-size:11px;

    line-height:1.5;

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
📍
</div>

<h1>
CBRND Location Sharing
</h1>

<p class="subtitle">

आपकी Location केवल आपकी अनुमति के बाद
इस tracking session में share होगी।

</p>


<div class="info">

<div class="info-title">
Tracking ID
</div>

<div
id="trackingIdDisplay"
class="info-value">
Loading...
</div>

</div>


<button
id="permissionButton"
class="permission-button"
onclick="startLocationSharing()">

📍 Allow & Share My Location

</button>


<button
id="stopButton"
class="stop-button"
onclick="stopLocationSharing()">

⛔ Stop Location Sharing

</button>


<div
id="status"
class="status">
</div>


<div
id="details"
class="details">

<div class="detail">

<span>
Latitude
</span>

<span id="lat">
—
</span>

</div>


<div class="detail">

<span>
Longitude
</span>

<span id="lng">
—
</span>

</div>


<div class="detail">

<span>
Accuracy
</span>

<span id="accuracy">
—
</span>

</div>


<div class="detail">

<span>
Last Update
</span>

<span id="updated">
—
</span>

</div>

</div>


<div class="footer">

CBRND Location Tracking System<br>

Location sharing starts only after browser permission.

</div>

</div>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyBBoLatjHkL56Lm0viPXcV91xcLewrosmI",

authDomain:
"cbrnd-location-tracker.firebaseapp.com",

databaseURL:
"https://cbrnd-location-tracker-default-rtdb.asia-southeast1.firebasedatabase.app/",

projectId:
"cbrnd-location-tracker",

storageBucket:
"cbrnd-location-tracker.firebasestorage.app",

messagingSenderId:
"513696622411",

appId:
"1:513696622411:web:52df6f0833380f76802ace",

measurementId:
"G-GCDRNNZQVY"

};

/* =====================================================
   VARIABLES
===================================================== */

let database = null;

let trackingId = null;

let watchId = null;

let sharing = false;


/* =====================================================
   INIT
===================================================== */

try{

firebase.initializeApp(
firebaseConfig
);

database =
firebase.database();

}catch(error){

console.error(error);

showStatus(
"Firebase initialization failed.",
"error"
);

}


/* =====================================================
   GET TRACKING ID
===================================================== */

const params =
new URLSearchParams(
window.location.search
);

trackingId =
params.get("id");


if(!trackingId){

document.getElementById(
"trackingIdDisplay"
).textContent =
"Invalid Tracking Link";

document.getElementById(
"permissionButton"
).disabled=true;

showStatus(
"❌ Tracking ID नहीं मिला। कृपया सही tracking link खोलें।",
"error"
);

}else{

document.getElementById(
"trackingIdDisplay"
).textContent =
trackingId;

}


/* =====================================================
   START LOCATION SHARING
===================================================== */

async function startLocationSharing(){

if(!trackingId){

showStatus(
"Invalid Tracking ID.",
"error"
);

return;

}


if(!navigator.geolocation){

showStatus(
"इस device/browser में GPS Location उपलब्ध नहीं है।",
"error"
);

return;

}


if(sharing){

return;

}


showStatus(
"📍 Location permission का इंतजार है...",
"waiting"
);


try{

/*
   Firebase status
*/

await database
.ref("locations/"+trackingId)
.update({

status:"requesting",

updatedAt:
firebase.database.ServerValue.TIMESTAMP

});


}catch(error){

console.error(error);

}


/*
   Browser permission
*/

watchId =
navigator.geolocation.watchPosition(

locationSuccess,

locationError,

{

enableHighAccuracy:true,

maximumAge:2000,

timeout:20000

}

);


sharing=true;


document.getElementById(
"permissionButton"
).style.display="none";

document.getElementById(
"stopButton"
).style.display="block";

}


/* =====================================================
   GPS SUCCESS
===================================================== */

async function locationSuccess(position){

const coords =
position.coords;


const latitude =
Number(coords.latitude);

const longitude =
Number(coords.longitude);

const accuracy =
Number(coords.accuracy || 0);


const speed =
coords.speed === null
? null
: Number(coords.speed);

const heading =
coords.heading === null
? null
: Number(coords.heading);


document.getElementById(
"lat"
).textContent =
latitude.toFixed(6);


document.getElementById(
"lng"
).textContent =
longitude.toFixed(6);


document.getElementById(
"accuracy"
).textContent =
Math.round(accuracy)+" m";


document.getElementById(
"updated"
).textContent =
new Date().toLocaleString();


document.getElementById(
"details"
).style.display="block";


showStatus(
"🟢 Location successfully sharing with the tracking session.",
"success"
);


try{

await database
.ref("locations/"+trackingId)
.update({

trackingId:trackingId,

status:"active",

latitude:latitude,

longitude:longitude,

accuracy:accuracy,

speed:speed,

heading:heading,

timestamp:
firebase.database.ServerValue.TIMESTAMP,

updatedAt:
firebase.database.ServerValue.TIMESTAMP

});

}catch(error){

console.error(error);

showStatus(
"Firebase Error: "+error.message,
"error"
);

}

}


/* =====================================================
   GPS ERROR
===================================================== */

function locationError(error){

console.error(
"GPS Error:",
error
);


switch(error.code){

case 1:

showStatus(
"❌ Location Permission denied. Browser settings में Location Allow करें।",
"error"
);

break;


case 2:

showStatus(
"❌ Location उपलब्ध नहीं है। GPS/Location Services चालू करें।",
"error"
);

break;


case 3:

showStatus(
"⏳ Location request timeout. फिर से कोशिश करें।",
"error"
);

break;


default:

showStatus(
"❌ Location प्राप्त नहीं हो सकी।",
"error"
);

}


sharing=false;

document.getElementById(
"permissionButton"
).style.display="block";

document.getElementById(
"stopButton"
).style.display="none";

}


/* =====================================================
   STOP
===================================================== */

async function stopLocationSharing(){

if(
watchId !== null
){

navigator.geolocation.clearWatch(
watchId
);

watchId=null;

}


sharing=false;


document.getElementById(
"permissionButton"
).style.display="block";

document.getElementById(
"stopButton"
).style.display="none";


try{

await database
.ref("locations/"+trackingId)
.update({

status:"stopped",

updatedAt:
firebase.database.ServerValue.TIMESTAMP

});

}catch(error){

console.error(error);

}


showStatus(
"⛔ Location sharing stopped.",
"waiting"
);

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
text,
type
){

const status =
document.getElementById(
"status"
);

status.textContent=text;

status.className=
"status "+type;

}


/* =====================================================
   PAGE CLOSE
===================================================== */

window.addEventListener(
"beforeunload",
function(){

if(
watchId !== null
){

navigator.geolocation.clearWatch(
watchId
);

}

});

</script>

</body>

</html>
