<!DOCTYPE html>
<html lang="hi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CBRND Location Tracker</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(
          135deg,
          #0f172a,
          #1e3a8a
        );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .card {

      width: 100%;
      max-width: 520px;

      background: white;

      padding: 30px;

      border-radius: 22px;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.35);

      text-align: center;
    }

    .logo {

      font-size: 65px;

      margin-bottom: 10px;
    }

    h1 {

      color: #111827;

      font-size: 27px;

      margin-bottom: 8px;
    }

    .subtitle {

      color: #6b7280;

      margin-bottom: 25px;

      line-height: 1.5;
    }

    .create-btn {

      width: 100%;

      padding: 17px;

      border: none;

      border-radius: 12px;

      background: #2563eb;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;
    }

    .create-btn:hover {

      background: #1d4ed8;
    }

    .result {

      display: none;

      margin-top: 22px;

      text-align: left;
    }

    .result-title {

      font-weight: bold;

      color: #111827;

      margin-bottom: 8px;
    }

    .tracking-id {

      background: #eff6ff;

      color: #1e40af;

      padding: 12px;

      border-radius: 9px;

      word-break: break-all;

      margin-bottom: 12px;
    }

    .link-box {

      display: flex;

      gap: 8px;

      margin-bottom: 12px;
    }

    .link-box input {

      flex: 1;

      min-width: 0;

      padding: 12px;

      border: 1px solid #d1d5db;

      border-radius: 9px;

      font-size: 13px;
    }

    .copy-btn {

      padding: 12px 16px;

      border: none;

      border-radius: 9px;

      background: #16a34a;

      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    .open-btn {

      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 9px;

      background: #111827;

      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    .admin-btn {

      width: 100%;

      margin-top: 10px;

      padding: 13px;

      border: none;

      border-radius: 9px;

      background: #7c3aed;

      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    .success {

      display: none;

      margin-top: 12px;

      padding: 10px;

      border-radius: 9px;

      background: #dcfce7;

      color: #166534;

      font-size: 14px;
    }

    .note {

      margin-top: 20px;

      color: #6b7280;

      font-size: 12px;

      line-height: 1.5;
    }

  </style>

</head>


<body>


<div class="card">


  <div class="logo">
    📍
  </div>


  <h1>
    CBRND Location Tracker
  </h1>


  <p class="subtitle">

    सुरक्षित Location Tracking Link बनाएँ
    और उसे दूसरे मोबाइल पर भेजें।

  </p>


  <button
    class="create-btn"
    onclick="createTrackingLink()"
  >
    🔗 Create Tracking Link
  </button>


  <div
    class="result"
    id="result"
  >

    <div class="result-title">
      🆔 Tracking ID
    </div>

    <div
      class="tracking-id"
      id="trackingId"
    >
      —
    </div>


    <div class="result-title">
      🔗 Tracking Link
    </div>


    <div class="link-box">

      <input
        id="trackingLink"
        readonly
      >

      <button
        class="copy-btn"
        onclick="copyLink()"
      >
        📋 Copy
      </button>

    </div>


    <button
      class="open-btn"
      onclick="openShareLink()"
    >
      📱 Open Share Page
    </button>


    <button
      class="admin-btn"
      onclick="openAdmin()"
    >
      🗺️ Open Admin Tracking
    </button>


    <div
      class="success"
      id="copyMessage"
    >
      ✅ Link copied successfully!
    </div>

  </div>


  <div class="note">

    ⚠️ Location केवल user की permission के बाद
    प्राप्त होगी। Tracking link को केवल
    authorized व्यक्ति के साथ share करें।

  </div>


</div>


<script>


  // ==============================================
  // CREATE RANDOM TRACKING ID
  // ==============================================

  function generateTrackingID() {

    const chars =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    let id = "";

    for (
      let i = 0;
      i < 12;
      i++
    ) {

      id +=
        chars.charAt(
          Math.floor(
            Math.random() * chars.length
          )
        );

    }

    return id;

  }


  // ==============================================
  // CREATE TRACKING LINK
  // ==============================================

  function createTrackingLink() {

    const trackingID =
      generateTrackingID();


    const baseURL =
      window.location.origin +
      window.location.pathname
        .replace(
          "index.html",
          ""
        );


    const shareLink =
      baseURL +
      "share.html?id=" +
      trackingID;


    document.getElementById(
      "trackingId"
    ).textContent =
      trackingID;


    document.getElementById(
      "trackingLink"
    ).value =
      shareLink;


    document.getElementById(
      "result"
    ).style.display =
      "block";


    // Save locally

    localStorage.setItem(
      "lastTrackingID",
      trackingID
    );

    localStorage.setItem(
      "lastTrackingLink",
      shareLink
    );

  }


  // ==============================================
  // COPY LINK
  // ==============================================

  async function copyLink() {

    const input =
      document.getElementById(
        "trackingLink"
      );


    try {

      await navigator.clipboard.writeText(
        input.value
      );

    } catch (error) {

      input.select();

      document.execCommand(
        "copy"
      );

    }


    const message =
      document.getElementById(
        "copyMessage"
      );


    message.style.display =
      "block";


    setTimeout(
      function() {

        message.style.display =
          "none";

      },
      2500
    );

  }


  // ==============================================
  // OPEN SHARE PAGE
  // ==============================================

  function openShareLink() {

    const link =
      document.getElementById(
        "trackingLink"
      ).value;


    if (!link) {

      return;

    }


    window.open(
      link,
      "_blank"
    );

  }


  // ==============================================
  // OPEN ADMIN
  // ==============================================

function openAdmin() {

  const trackingID =
    document.getElementById("trackingId").textContent.trim();

  if (!trackingID || trackingID === "—") {
    alert("पहले Tracking Link बनाइए।");
    return;
  }

  const adminURL =
    "https://somchandtrust-boo.github.io/CBRND-Location-Tracker/admin.html?id=" +
    encodeURIComponent(trackingID);

  window.open(adminURL, "_blank");
}


</script>


</body>

</html>
