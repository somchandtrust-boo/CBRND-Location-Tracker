<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CBRND Secure Location Admin</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#0f172a;color:#fff;min-height:100vh}
button,input{font-family:inherit}
button{cursor:pointer}

#authScreen{
min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:20px;
background:radial-gradient(circle at top right,#1d4ed8 0,transparent 35%),
linear-gradient(135deg,#020617,#0f172a,#172554)
}

.auth-card{
width:100%;max-width:440px;background:#1e293b;
border:1px solid #334155;border-radius:22px;padding:30px;
box-shadow:0 25px 70px rgba(0,0,0,.45)
}

.auth-logo{text-align:center;font-size:52px;margin-bottom:8px}
.auth-title{text-align:center;font-size:25px}
.auth-subtitle{text-align:center;color:#94a3b8;font-size:14px;line-height:1.5;margin:7px 0 22px}

.auth-tabs{
display:grid;grid-template-columns:1fr 1fr;gap:6px;
background:#0f172a;padding:5px;border-radius:11px;margin-bottom:20px
}

.auth-tab{
padding:11px;border:0;border-radius:8px;background:transparent;
color:#94a3b8;font-weight:bold
}

.auth-tab.active{background:#2563eb;color:#fff}

.form-group{margin-bottom:14px}
.form-group label{display:block;color:#cbd5e1;font-size:13px;margin-bottom:6px}

.input-wrap{position:relative}
.form-input{
width:100%;padding:13px 45px 13px 13px;border:1px solid #475569;
border-radius:10px;background:#0f172a;color:#fff;outline:none;font-size:15px
}
.form-input:focus{border-color:#3b82f6}

.show-password{
position:absolute;right:10px;top:50%;transform:translateY(-50%);
border:0;background:transparent;color:#94a3b8;font-size:18px
}

.auth-button{
width:100%;padding:14px;border:0;border-radius:10px;
background:#2563eb;color:#fff;font-size:16px;font-weight:bold
}
.auth-button:hover{background:#1d4ed8}

.forgot-button{
width:100%;border:0;background:transparent;color:#60a5fa;
margin-top:15px;font-size:13px
}

.auth-message{
display:none;padding:11px;border-radius:9px;margin-bottom:15px;
font-size:13px;line-height:1.5
}
.auth-message.success{display:block;background:#14532d;color:#bbf7d0}
.auth-message.error{display:block;background:#7f1d1d;color:#fecaca}
.auth-message.info{display:block;background:#1e3a8a;color:#bfdbfe}

.security-note{
margin-top:18px;padding:10px;border-radius:9px;background:#172554;
color:#bfdbfe;font-size:11px;line-height:1.5;text-align:center
}

#dashboardScreen{display:none;min-height:100vh}

.header{
background:#111827;border-bottom:1px solid #374151;padding:14px 20px;
display:flex;align-items:center;justify-content:space-between;gap:15px
}

.header-left{display:flex;align-items:center;gap:10px}
.header-icon{font-size:30px}
.header-title h1{font-size:19px}
.header-title small{color:#94a3b8;font-size:11px}

.header-right{display:flex;align-items:center;gap:8px}
.live-badge{
background:#14532d;color:#bbf7d0;padding:7px 11px;
border-radius:20px;font-size:12px;font-weight:bold
}

.logout-button{
border:0;background:#dc2626;color:#fff;padding:9px 13px;
border-radius:8px;font-weight:bold
}

.container{max-width:1450px;margin:auto;padding:15px}

.control-panel{
background:#1e293b;padding:15px;border-radius:14px;
margin-bottom:15px;border:1px solid #334155
}

.control-row{display:flex;gap:10px;flex-wrap:wrap}

.tracking-input{
flex:1;min-width:250px;padding:13px;border:1px solid #475569;
border-radius:9px;background:#0f172a;color:#fff;outline:none;font-size:15px
}

.start-button{
padding:13px 18px;border:0;border-radius:9px;
background:#2563eb;color:#fff;font-weight:bold
}

.message{
margin-top:12px;padding:12px;border-radius:9px;
font-size:14px;display:none
}
.message.success{display:block;background:#14532d;color:#bbf7d0}
.message.error{display:block;background:#7f1d1d;color:#fecaca}
.message.waiting{display:block;background:#713f12;color:#fef3c7}

.dashboard{
display:grid;grid-template-columns:330px 1fr;gap:15px
}

.side-panel{
background:#1e293b;padding:18px;border-radius:14px;
border:1px solid #334155
}

.side-panel h2{font-size:18px;margin-bottom:15px}

.status-card{
background:#0f172a;padding:13px;border-radius:10px;margin-bottom:10px
}

.label{color:#94a3b8;font-size:12px;margin-bottom:5px}
.value{color:#fff;font-size:15px;font-weight:bold;word-break:break-word}

.map-container{
background:#1e293b;padding:8px;border-radius:14px;
border:1px solid #334155
}

#map{width:100%;height:620px;border-radius:10px}

.map-button,.stop-button{
width:100%;padding:13px;border:0;border-radius:9px;
color:#fff;font-weight:bold;margin-top:5px
}

.map-button{background:#16a34a}
.stop-button{background:#dc2626;margin-top:10px}

@media(max-width:850px){
.dashboard{grid-template-columns:1fr}
#map{height:480px}
.header{flex-direction:column;align-items:flex-start}
.header-right{width:100%}
.live-badge{flex:1;text-align:center}
}
</style>
</head>

<body>

<!-- AUTH -->
<section id="authScreen">
<div class="auth-card">

<div class="auth-logo">🛡️</div>
<h1 class="auth-title">CBRND Admin</h1>
<p class="auth-subtitle">
Secure Location Tracking Control Panel
</p>

<div class="auth-tabs">
<button id="loginTab" class="auth-tab active"
onclick="showLogin()">🔐 Login</button>

<button id="registerTab" class="auth-tab"
onclick="showRegister()">📝 Register</button>
</div>

<div id="authMessage" class="auth-message"></div>

<!-- LOGIN -->
<div id="loginForm">

<div class="form-group">
<label>📧 Admin Email</label>
<input id="loginEmail" class="form-input"
type="email" placeholder="admin@example.com">
</div>

<div class="form-group">
<label>🔑 Password</label>
<div class="input-wrap">
<input id="loginPassword" class="form-input"
type="password" placeholder="Password">
<button class="show-password"
onclick="togglePassword('loginPassword',this)">👁️</button>
</div>
</div>

<button class="auth-button" onclick="loginAdmin()">
🔐 Login
</button>

<button class="forgot-button" onclick="forgotPassword()">
🔄 Forgot Password?
</button>

</div>

<!-- REGISTER -->
<div id="registerForm" style="display:none">

<div class="form-group">
<label>📧 Email</label>
<input id="registerEmail" class="form-input"
type="email" placeholder="admin@example.com">
</div>

<div class="form-group">
<label>🔑 Password</label>
<div class="input-wrap">
<input id="registerPassword" class="form-input"
type="password" placeholder="Minimum 6 characters">
<button class="show-password"
onclick="togglePassword('registerPassword',this)">👁️</button>
</div>
</div>

<div class="form-group">
<label>🔐 Confirm Password</label>
<div class="input-wrap">
<input id="registerConfirm" class="form-input"
type="password" placeholder="Password दोबारा डालें">
<button class="show-password"
onclick="togglePassword('registerConfirm',this)">👁️</button>
</div>
</div>

<div class="form-group">
<label>🛡️ Admin Registration Code</label>
<div class="input-wrap">
<input id="inviteCode" class="form-input"
type="password" placeholder="Registration Code">
<button class="show-password"
onclick="togglePassword('inviteCode',this)">👁️</button>
</div>
</div>

<button class="auth-button" onclick="registerAdmin()">
📝 Create Admin Account
</button>

</div>

<div class="security-note">
🔒 Authorized Admin Registration Code के बिना account नहीं बनाया जा सकता।
</div>

</div>
</section>


<!-- DASHBOARD -->
<section id="dashboardScreen">

<header class="header">

<div class="header-left">
<div class="header-icon">📍</div>

<div class="header-title">
<h1>CBRND Live Location Admin</h1>
<small id="adminEmailDisplay">Admin</small>
</div>
</div>

<div class="header-right">
<div class="live-badge">🟢 SECURE ADMIN</div>

<button class="logout-button"
onclick="logoutAdmin()">
🚪 Logout
</button>
</div>

</header>


<main class="container">

<section class="control-panel">

<div class="control-row">

<input id="trackingId"
class="tracking-input"
placeholder="Tracking ID डालें">

<button class="start-button"
onclick="startTracking()">
🔍 Start Tracking
</button>

</div>

<div id="message" class="message"></div>

</section>


<section class="dashboard">

<aside class="side-panel">

<h2>📊 Location Information</h2>

<div class="status-card">
<div class="label">Tracking ID</div>
<div id="displayId" class="value">—</div>
</div>

<div class="status-card">
<div class="label">Connection Status</div>
<div id="locationStatus" class="value">⚪ Waiting</div>
</div>

<div class="status-card">
<div class="label">Latitude</div>
<div id="latitude" class="value">—</div>
</div>

<div class="status-card">
<div class="label">Longitude</div>
<div id="longitude" class="value">—</div>
</div>

<div class="status-card">
<div class="label">GPS Accuracy</div>
<div id="accuracy" class="value">—</div>
</div>

<div class="status-card">
<div class="label">Last Update</div>
<div id="lastUpdate" class="value">—</div>
</div>

<button class="map-button"
onclick="openGoogleMaps()">
🗺️ Open Google Maps
</button>

<button class="stop-button"
onclick="stopTracking()">
⛔ Stop Tracking
</button>

</aside>

<div class="map-container">
<div id="map"></div>
</div>

</section>
</main>
</section>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>

/* =====================================================
   FIREBASE CONFIG
   अपनी EXISTING CONFIG यहाँ रखें
===================================================== */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBBoLatjHkL56Lm0viPXcV91xcLewrosmI",
  authDomain: "cbrnd-location-tracker.firebaseapp.com",
  databaseURL: "https://cbrnd-location-tracker-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "cbrnd-location-tracker",
  storageBucket: "cbrnd-location-tracker.firebasestorage.app",
  messagingSenderId: "513696622411",
  appId: "1:513696622411:web:52df6f0833380f76802ace",
  measurementId: "G-GCDRNNZQVY"
};


/* =====================================================
   ADMIN INVITE CODE
===================================================== */

const ADMIN_INVITE_CODE =
"Kam@1995";


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let auth = null;
let database = null;

let activeListener = null;

let map = null;
let marker = null;
let accuracyCircle = null;

let currentLatitude = null;
let currentLongitude = null;

let firstLocationReceived = false;

let lastAcceptedLat = null;
let lastAcceptedLng = null;

let animationFrame = null;


/* =====================================================
   FIREBASE INIT
===================================================== */

try{

firebase.initializeApp(firebaseConfig);

auth = firebase.auth();

database = firebase.database();

auth.onAuthStateChanged(function(user){

if(user){
showDashboard(user);
}else{
showAuthScreen();
}

});

}catch(error){

console.error(error);

showAuthMessage(
"Firebase configuration में समस्या है।",
"error"
);

}


/* =====================================================
   AUTH
===================================================== */

function showLogin(){

document.getElementById("loginForm").style.display="block";
document.getElementById("registerForm").style.display="none";

document.getElementById("loginTab").classList.add("active");
document.getElementById("registerTab").classList.remove("active");

clearAuthMessage();

}


function showRegister(){

document.getElementById("loginForm").style.display="none";
document.getElementById("registerForm").style.display="block";

document.getElementById("loginTab").classList.remove("active");
document.getElementById("registerTab").classList.add("active");

clearAuthMessage();

}


/* =====================================================
   REGISTER
===================================================== */

async function registerAdmin(){

const email =
document.getElementById("registerEmail").value.trim();

const password =
document.getElementById("registerPassword").value;

const confirm =
document.getElementById("registerConfirm").value;

const code =
document.getElementById("inviteCode").value.trim();


if(!email){
showAuthMessage("Email डालें।","error");
return;
}

if(password.length < 6){
showAuthMessage(
"Password कम से कम 6 characters का होना चाहिए।",
"error"
);
return;
}

if(password !== confirm){
showAuthMessage(
"Password और Confirm Password अलग हैं।",
"error"
);
return;
}

if(code !== ADMIN_INVITE_CODE){
showAuthMessage(
"❌ गलत Admin Registration Code।",
"error"
);
return;
}


showAuthMessage(
"Account बनाया जा रहा है...",
"info"
);


try{

await auth.createUserWithEmailAndPassword(
email,
password
);

showAuthMessage(
"✅ Admin account successfully बनाया गया।",
"success"
);

}catch(error){

console.error(error);

showAuthMessage(
firebaseError(error),
"error"
);

}

}


/* =====================================================
   LOGIN
===================================================== */

async function loginAdmin(){

const email =
document.getElementById("loginEmail").value.trim();

const password =
document.getElementById("loginPassword").value;


if(!email){
showAuthMessage("Email डालें।","error");
return;
}

if(!password){
showAuthMessage("Password डालें।","error");
return;
}


showAuthMessage(
"Login हो रहा है...",
"info"
);


try{

await auth.signInWithEmailAndPassword(
email,
password
);

}catch(error){

console.error(error);

showAuthMessage(
firebaseError(error),
"error"
);

}

}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

async function forgotPassword(){

const email =
document.getElementById("loginEmail").value.trim();


if(!email){

showAuthMessage(
"पहले Email डालें।",
"error"
);

return;
}


try{

await auth.sendPasswordResetEmail(email);

showAuthMessage(
"✅ Password reset link email पर भेज दिया गया है।",
"success"
);

}catch(error){

showAuthMessage(
firebaseError(error),
"error"
);

}

}


/* =====================================================
   LOGOUT
===================================================== */

async function logoutAdmin(){

stopTracking();

try{
await auth.signOut();
}catch(error){
console.error(error);
}

}


/* =====================================================
   SHOW DASHBOARD
===================================================== */

function showDashboard(user){

document.getElementById("authScreen").style.display="none";
document.getElementById("dashboardScreen").style.display="block";

document.getElementById("adminEmailDisplay").textContent =
user.email || "Authorized Admin";

initializeMap();


setTimeout(function(){

if(map){
map.invalidateSize();
}

},300);


/* URL tracking */

const params =
new URLSearchParams(window.location.search);

const id =
params.get("id");


if(id){

document.getElementById("trackingId").value=id;

setTimeout(function(){
startTracking();
},500);

}

}


/* =====================================================
   AUTH SCREEN
===================================================== */

function showAuthScreen(){

document.getElementById("authScreen").style.display="flex";
document.getElementById("dashboardScreen").style.display="none";

}


/* =====================================================
   MAP
===================================================== */

function initializeMap(){

if(map)return;

map =
L.map("map").setView(
[23.0225,72.5714],
12
);


L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap contributors"
}
).addTo(map);

}


/* =====================================================
   DISTANCE
===================================================== */

function calculateDistance(
lat1,lon1,lat2,lon2
){

const R=6371000;

const dLat =
(lat2-lat1)*Math.PI/180;

const dLon =
(lon2-lon1)*Math.PI/180;

const a =
Math.sin(dLat/2)**2 +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLon/2)**2;

return R*2*Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

}


/* =====================================================
   START TRACKING
===================================================== */

function startTracking(){

const id =
document.getElementById("trackingId").value.trim();


if(!id){

showMessage(
"कृपया Tracking ID डालें।",
"error"
);

return;

}


if(!database){

showMessage(
"Firebase Database उपलब्ध नहीं है।",
"error"
);

return;

}


/* पुराने listener को हटाएँ */

if(activeListener){

try{
activeListener.off();
}catch(e){
console.error(e);
}

activeListener=null;

}


if(animationFrame){

cancelAnimationFrame(animationFrame);

animationFrame=null;

}


firstLocationReceived=false;

lastAcceptedLat=null;
lastAcceptedLng=null;

currentLatitude=null;
currentLongitude=null;


document.getElementById("displayId").textContent=id;

document.getElementById("locationStatus").textContent=
"🟡 Connecting...";


showMessage(
"Live tracking शुरू हो गई है...",
"waiting"
);


const locationRef =
database.ref(
"locations/"+id
);


activeListener =
locationRef;


/* Firebase realtime listener */

locationRef.on(
"value",
function(snapshot){

const data=snapshot.val();

if(!data){

document.getElementById(
"locationStatus"
).textContent="🟡 Waiting...";

showMessage(
"इस Tracking ID से अभी Location नहीं मिली।",
"waiting"
);

return;

}

processLocation(data);

},
function(error){

console.error(error);

showMessage(
"Firebase error: "+error.message,
"error"
);

}
);

}


/* =====================================================
   PROCESS LOCATION
===================================================== */

function processLocation(data){

const lat=Number(data.latitude);
const lng=Number(data.longitude);

const accuracy=Number(data.accuracy || 0);


if(
!Number.isFinite(lat) ||
!Number.isFinite(lng)
){
return;
}


/* छोटी GPS noise ignore */

if(
lastAcceptedLat!==null &&
lastAcceptedLng!==null
){

const distance =
calculateDistance(
lastAcceptedLat,
lastAcceptedLng,
lat,
lng
);


/*
  2 meter से कम movement
  और poor accuracy होने पर
  marker को unnecessary move नहीं करेंगे.
*/

if(
distance<2 &&
accuracy>20
){

updateInformation(
lat,lng,accuracy,data
);

return;

}

}


lastAcceptedLat=lat;
lastAcceptedLng=lng;


updateInformation(
lat,lng,accuracy,data
);


if(!firstLocationReceived){

firstLocationReceived=true;

currentLatitude=lat;
currentLongitude=lng;

createMarker(
lat,lng,accuracy
);


map.setView(
[lat,lng],
17,
{
animate:true,
duration:.7
}
);

return;

}


/* Smooth marker movement */

smoothMoveMarker(
lat,lng,accuracy
);

}


/* =====================================================
   CREATE MARKER
===================================================== */

function createMarker(
lat,lng,accuracy
){

if(!marker){

marker =
L.marker(
[lat,lng],
{
riseOnHover:true
}
).addTo(map);


marker.bindPopup(
"📍 Live Location"
);

}


if(!accuracyCircle){

accuracyCircle =
L.circle(
[lat,lng],
{
radius:Math.max(
accuracy,
10
),
weight:1,
fillOpacity:.12
}
).addTo(map);

}

}


/* =====================================================
   SMOOTH MARKER
===================================================== */

function smoothMoveMarker(
targetLat,
targetLng,
accuracy
){

if(!marker){

createMarker(
targetLat,
targetLng,
accuracy
);

return;

}


const start =
marker.getLatLng();


const startLat=start.lat;
const startLng=start.lng;

const duration=700;

const startTime=performance.now();


if(animationFrame){

cancelAnimationFrame(
animationFrame
);

}


function animate(now){

let progress =
(now-startTime)/duration;


if(progress>1)
progress=1;


const eased =
1-Math.pow(
1-progress,
3
);


const lat =
startLat+
(targetLat-startLat)*
eased;


const lng =
startLng+
(targetLng-startLng)*
eased;


marker.setLatLng(
[lat,lng]
);


if(accuracyCircle){

accuracyCircle.setLatLng(
[lat,lng]
);

accuracyCircle.setRadius(
Math.max(
accuracy,
10
)
);

}


if(progress<1){

animationFrame =
requestAnimationFrame(
animate
);

}else{

marker.setLatLng(
[targetLat,targetLng]
);

if(accuracyCircle){

accuracyCircle.setLatLng(
[targetLat,targetLng]
);

}

}

}


animationFrame =
requestAnimationFrame(
animate
);

}


/* =====================================================
   LOCATION INFORMATION
===================================================== */

function updateInformation(
lat,lng,accuracy,data
){

currentLatitude=lat;
currentLongitude=lng;


document.getElementById(
"latitude"
).textContent=
lat.toFixed(6);


document.getElementById(
"longitude"
).textContent=
lng.toFixed(6);


document.getElementById(
"accuracy"
).textContent=
Math.round(accuracy)+" meters";


let time="—";


if(data.timestamp){

const date =
new Date(
Number(data.timestamp)
);

if(!Number.isNaN(date.getTime())){

time =
date.toLocaleString();

}

}


document.getElementById(
"lastUpdate"
).textContent=time;


document.getElementById(
"locationStatus"
).textContent="🟢 LIVE";


showMessage(
"✅ Live Location connected",
"success"
);

}


/* =====================================================
   STOP TRACKING
===================================================== */

function stopTracking(){

if(activeListener){

try{
activeListener.off();
}catch(e){
console.error(e);
}

activeListener=null;

}


if(animationFrame){

cancelAnimationFrame(
animationFrame
);

animationFrame=null;

}


firstLocationReceived=false;

currentLatitude=null;
currentLongitude=null;


document.getElementById(
"locationStatus"
).textContent=
"⛔ Stopped";


showMessage(
"Tracking बंद कर दी गई है।",
"waiting"
);

}

){

);

}


window.open(
"https://www.google.com/maps?q="+
currentLatitude+
","+
currentLongitude,
"_blank"
);

}

/* =====================================================
   FIREBASE ERROR
===================================================== */

function firebaseError(error){

const code =
error && error.code
?error.code:"";


switch(code){

case "auth/email-already-in-use":
return "यह Email पहले से registered है। Login करें।";

case "auth/invalid-email":
return "Email address सही नहीं है।";

case "auth/weak-password":
return "Password कम से कम 6 characters का रखें।";

case "auth/user-not-found":
return "यह account मौजूद नहीं है।";

case "auth/wrong-password":
return "Password गलत है।";

case "auth/invalid-credential":
return "Email या Password गलत है।";

case "auth/operation-not-allowed":
return "Firebase Authentication में Email/Password अभी Enable नहीं है।";

case "auth/too-many-requests":
return "बहुत ज्यादा attempts हुए हैं। थोड़ी देर बाद कोशिश करें।";

case "auth/network-request-failed":
return "Internet connection check करें।";

default:
return error?.message || "Unknown Firebase error";

}

}
