<!DOCTYPE html>
<html lang="hi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>CBRND Live Location Admin</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      min-height: 100vh;
    }

    .header {
      background: #111827;
      padding: 15px 20px;
      border-bottom: 1px solid #374151;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .header h1 {
      font-size: 20px;
    }

    .live-badge {
      background: #166534;
      color: #dcfce7;

      padding: 7px 12px;

      border-radius: 20px;

      font-size: 13px;
      font-weight: bold;
    }

    .container {
      max-width: 1450px;
      margin: auto;
      padding: 15px;
    }

    .control-panel {
      background: #1e293b;

      padding: 15px;

      border-radius: 14px;

      margin-bottom: 15px;
    }

    .control-row {
      display: flex;

      gap: 10px;

      flex-wrap: wrap;
    }

    .control-row input {
      flex: 1;

      min-width: 250px;

      padding: 13px;

      border: 1px solid #475569;

      border-radius: 9px;

      background: #0f172a;

      color: white;

      outline: none;

      font-size: 15px;
    }

    .control-row button {
      padding: 13px 18px;

      border: none;

      border-radius: 9px;

      background: #2563eb;

      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    .control-row button:hover {
      background: #1d4ed8;
    }

    .dashboard {
      display: grid;

      grid-template-columns: 330px 1fr;

      gap: 15px;
    }

    .side-panel {
      background: #1e293b;

      padding: 18px;

      border-radius: 14px;
    }

    .side-panel h2 {
      font-size: 18px;

      margin-bottom: 15px;
    }

    .status-card {
      background: #0f172a;

      padding: 13px;

      border-radius: 10px;

      margin-bottom: 10px;
    }

    .label {
      color: #94a3b8;

      font-size: 12px;

      margin-bottom: 5px;
    }

    .value {
      color: white;

      font-size: 15px;

      font-weight: bold;

      word-break: break-word;
    }

    .map-container {
      background: #1e293b;

      padding: 8px;

      border-radius: 14px;
    }

    #map {
      width: 100%;

      height: 620px;

      border-radius: 10px;
    }

    .message {
      margin-top: 12px;

      padding: 12px;

      border-radius: 9px;

      font-size: 14px;

      display: none;
    }

    .message.success {
      display: block;

      background: #14532d;

      color: #bbf7d0;
    }

    .message.error {
      display: block;

      background: #7f1d1d;

      color: #fecaca;
    }

    .message.waiting {
      display: block;

      background: #713f12;

      color: #fef3c7;
    }

    .map-button {
      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 9px;

      background: #16a34a;

      color: white;

      font-weight: bold;

      cursor: pointer;

      margin-top: 5px;
    }

    .map-button:hover {
      background: #15803d;
    }

    .stop-button {
      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 9px;

      background: #dc2626;

      color: white;

      font-weight: bold;

      cursor: pointer;

      margin-top: 10px;
    }

    .stop-button:hover {
      background: #b91c1c;
    }

    @media (max-width: 850px) {

      .dashboard {
        grid-template-columns: 1fr;
      }

      #map {
        height: 480px;
      }

      .header {
        flex-direction: column;

        align-items: flex-start;
      }

    }

  </style>

</head>


<body>


<header class="header">

  <h1>
    📍 CBRND Live Location Admin
  </h1>

  <div class="live-badge">
    🟢 LIVE MONITOR
  </div>

</header>


<main class="container">


  <!-- CONTROL -->

  <section class="control-panel">

    <div class="control-row">

      <input
        type="text"
        id="trackingId"
        placeholder="Tracking ID डालें"
      >

      <button
        type="button"
        onclick="startTracking()"
      >
        🔍 Start Tracking
      </button>

    </div>

    <div
      id="message"
      class="message"
    ></div>

  </section>


  <!-- DASHBOARD -->

  <section class="dashboard">


    <!-- LEFT PANEL -->

    <aside class="side-panel">

      <h2>
        📊 Location Information
      </h2>


      <div class="status-card">

        <div class="label">
          Tracking ID
        </div>

        <div
          class="value"
          id="displayId"
        >
          —
        </div>

      </div>


      <div class="status-card">

        <div class="label">
          Connection Status
        </div>

        <div
          class="value"
          id="locationStatus"
        >
          ⚪ Waiting
        </div>

      </div>


      <div class="status-card">

        <div class="label">
          Latitude
        </div>

        <div
          class="value"
          id="latitude"
        >
          —
        </div>

      </div>


      <div class="status-card">

        <div class="label">
          Longitude
        </div>

        <div
          class="value"
          id="longitude"
        >
          —
        </div>

      </div>


      <div class="status-card">

        <div class="label">
          GPS Accuracy
        </div>

        <div
          class="value"
          id="accuracy"
        >
          —
        </div>

      </div>


      <div class="status-card">

        <div class="label">
          Last Update
        </div>

        <div
          class="value"
          id="lastUpdate"
        >
          —
        </div>

      </div>


      <button
        type="button"
        class="map-button"
        onclick="openGoogleMaps()"
      >
        🗺️ Open Google Maps
      </button>


      <button
        type="button"
        class="stop-button"
        onclick="stopTracking()"
      >
        ⛔ Stop Tracking
      </button>

    </aside>


    <!-- MAP -->

    <div class="map-container">

      <div id="map"></div>

    </div>

  </section>

</main>


<!-- Leaflet JS -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<!-- Firebase -->

<script
  src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
</script>

<script
  src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js">
</script>


<script>


/* =====================================================
   FIREBASE CONFIG
===================================================== */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBBoLatjHkL56Lm0viPXcV91xcLewrosmI",
  authDomain: "cbrnd-location-tracker.firebaseapp.com",
  databaseURL: "https://cbrnd-location-tracker-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "cbrnd-location-tracker",
  storageBucket: "cbrnd-location-tracker.firebasestorage.app",
  messagingSenderId: "513696622411",
  appId: "1:513696622411:web:52df6f0833380f76802ace",
  measurementId: "G-GCDRNNZQVY"
};


/* =====================================================
   FIREBASE INITIALIZATION
===================================================== */

let database = null;

try {

  firebase.initializeApp(
    firebaseConfig
  );

  database =
    firebase.database();

} catch (error) {

  console.error(
    "Firebase initialization error:",
    error
  );

}


/* =====================================================
   GLOBAL VARIABLES
   IMPORTANT:
   activeListener MUST BE DECLARED BEFORE
   startTracking() CAN RUN.
===================================================== */

let activeListener = null;

let marker = null;

let accuracyCircle = null;

let currentLatitude = null;

let currentLongitude = null;


/* =====================================================
   MAP
===================================================== */

const map =
  L.map("map").setView(
    [23.0225, 72.5714],
    12
  );


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,

    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* =====================================================
   GET TRACKING ID FROM URL
===================================================== */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const urlTrackingId =
  urlParams.get("id");


/*
  IMPORTANT:
  activeListener is already declared above,
  so startTracking() is now safe to call.
*/

if (urlTrackingId) {

  document.getElementById(
    "trackingId"
  ).value =
    urlTrackingId;

  startTracking();

}


/* =====================================================
   START TRACKING
===================================================== */

function startTracking() {


  const id =
    document.getElementById(
      "trackingId"
    ).value.trim();


  /* -----------------------------------------------
     CHECK ID
  ----------------------------------------------- */

  if (!id) {

    showMessage(
      "कृपया Tracking ID डालें।",
      "error"
    );

    return;

  }


  /* -----------------------------------------------
     CHECK FIREBASE
  ----------------------------------------------- */

  if (!database) {

    showMessage(
      "Firebase initialize नहीं हुआ। Firebase Config check करें।",
      "error"
    );

    return;

  }


  /* -----------------------------------------------
     REMOVE OLD LISTENER
  ----------------------------------------------- */

  if (activeListener) {

    try {

      activeListener.off();

    } catch (error) {

      console.error(
        "Listener remove error:",
        error
      );

    }

    activeListener = null;

  }


  /* -----------------------------------------------
     RESET
  ----------------------------------------------- */

  currentLatitude = null;

  currentLongitude = null;


  document.getElementById(
    "displayId"
  ).textContent =
    id;


  document.getElementById(
    "latitude"
  ).textContent =
    "—";


  document.getElementById(
    "longitude"
  ).textContent =
    "—";


  document.getElementById(
    "accuracy"
  ).textContent =
    "—";


  document.getElementById(
    "lastUpdate"
  ).textContent =
    "—";


  document.getElementById(
    "locationStatus"
  ).textContent =
    "🟡 Waiting...";


  showMessage(
    "Tracking शुरू हो गई है। Location का इंतजार है...",
    "waiting"
  );


  /* -----------------------------------------------
     FIREBASE LOCATION REFERENCE
  ----------------------------------------------- */

  const locationRef =
    database.ref(
      "locations/" + id
    );


  /*
    SAVE CURRENT LISTENER
  */

  activeListener =
    locationRef;


  /* -----------------------------------------------
     FIREBASE LIVE LISTENER
  ----------------------------------------------- */

  locationRef.on(

    "value",

    function(snapshot) {


      const data =
        snapshot.val();


      console.log(
        "Firebase location data:",
        data
      );


      /* -----------------------------------------
         NO LOCATION
      ----------------------------------------- */

      if (!data) {

        document.getElementById(
          "locationStatus"
        ).textContent =
          "🟡 Waiting...";


        showMessage(
          "इस Tracking ID से अभी Location प्राप्त नहीं हुई है।",
          "waiting"
        );


        return;

      }


      /* -----------------------------------------
         LOCATION RECEIVED
      ----------------------------------------- */

      updateLocation(
        data
      );

    },


    function(error) {


      console.error(
        "Firebase listener error:",
        error
      );


      if (
        error &&
        error.code ===
        "PERMISSION_DENIED"
      ) {

        showMessage(
          "Firebase Permission Denied. Realtime Database Rules check करें।",
          "error"
        );

      } else {

        showMessage(
          "Firebase से Location पढ़ने में समस्या हुई।",
          "error"
        );

      }

    }

  );

}


/* =====================================================
   UPDATE LOCATION
===================================================== */

function updateLocation(
  data
) {


  /* -----------------------------------------------
     GET COORDINATES
  ----------------------------------------------- */

  const lat =
    Number(
      data.latitude
    );


  const lng =
    Number(
      data.longitude
    );


  /* -----------------------------------------------
     VALIDATE
  ----------------------------------------------- */

  if (
    !Number.isFinite(lat) ||
    !Number.isFinite(lng)
  ) {

    showMessage(
      "Firebase से Invalid GPS coordinates मिले।",
      "error"
    );

    return;

  }


  /* -----------------------------------------------
     SAVE CURRENT LOCATION
  ----------------------------------------------- */

  currentLatitude =
    lat;

  currentLongitude =
    lng;


  /* -----------------------------------------------
     ACCURACY
  ----------------------------------------------- */

  const accuracy =
    Number(
      data.accuracy || 0
    );


  /* -----------------------------------------------
     UPDATE TEXT
  ----------------------------------------------- */

  document.getElementById(
    "latitude"
  ).textContent =
    lat.toFixed(6);


  document.getElementById(
    "longitude"
  ).textContent =
    lng.toFixed(6);


  document.getElementById(
    "accuracy"
  ).textContent =
    Math.round(
      accuracy
    ) + " meters";


  /* -----------------------------------------------
     TIMESTAMP
  ----------------------------------------------- */

  let updateTime =
    "—";


  if (
    data.timestamp
  ) {

    const date =
      new Date(
        Number(
          data.timestamp
        )
      );


    if (
      !Number.isNaN(
        date.getTime()
      )
    ) {

      updateTime =
        date.toLocaleString();

    }

  }


  document.getElementById(
    "lastUpdate"
  ).textContent =
    updateTime;


  /* -----------------------------------------------
     LIVE STATUS
  ----------------------------------------------- */

  document.getElementById(
    "locationStatus"
  ).textContent =
    "🟢 LIVE";


  showMessage(
    "✅ Live Location प्राप्त हो रही है।",
    "success"
  );


  /* -----------------------------------------------
     MAP MARKER
  ----------------------------------------------- */

  if (!marker) {


    marker =
      L.marker(
        [lat, lng]
      ).addTo(
        map
      );


  } else {


    marker.setLatLng(
      [lat, lng]
    );

  }


  /* -----------------------------------------------
     POPUP
  ----------------------------------------------- */

  marker.bindPopup(

    `
      <div style="font-size:14px">

        <b>📍 LIVE LOCATION</b>

        <br><br>

        <b>Latitude:</b>
        ${lat.toFixed(6)}

        <br>

        <b>Longitude:</b>
        ${lng.toFixed(6)}

        <br>

        <b>Accuracy:</b>
        ${Math.round(accuracy)} m

        <br>

        <b>Updated:</b>
        ${updateTime}

      </div>
    `

  );


  /* -----------------------------------------------
     ACCURACY CIRCLE
  ----------------------------------------------- */

  if (!accuracyCircle) {


    accuracyCircle =
      L.circle(
        [lat, lng],
        {
          radius:
            Math.max(
              accuracy,
              10
            )
        }
      ).addTo(
        map
      );


  } else {


    accuracyCircle.setLatLng(
      [lat, lng]
    );


    accuracyCircle.setRadius(
      Math.max(
        accuracy,
        10
      )
    );

  }


  /* -----------------------------------------------
     MOVE MAP
  ----------------------------------------------- */

  map.setView(
    [lat, lng],
    17
  );

}


/* =====================================================
   OPEN GOOGLE MAPS
===================================================== */

function openGoogleMaps() {


  if (
    currentLatitude === null ||
    currentLongitude === null
  ) {


    showMessage(
      "अभी Location उपलब्ध नहीं है।",
      "error"
    );


    return;

  }


  const googleMapsURL =
    "https://www.google.com/maps?q=" +
    currentLatitude +
    "," +
    currentLongitude;


  window.open(
    googleMapsURL,
    "_blank"
  );

}


/* =====================================================
   STOP ADMIN LISTENER
===================================================== */

function stopTracking() {


  if (activeListener) {


    try {

      activeListener.off();

    } catch (error) {

      console.error(
        error
      );

    }


    activeListener =
      null;

  }


  document.getElementById(
    "locationStatus"
  ).textContent =
    "⛔ Stopped";


  showMessage(
    "Admin location tracking listener बंद कर दिया गया है।",
    "waiting"
  );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
) {


  const box =
    document.getElementById(
      "message"
    );


  box.textContent =
    text;


  box.className =
    "message " + type;

}


/* =====================================================
   HANDLE PAGE VISIBILITY
===================================================== */

document.addEventListener(
  "visibilitychange",
  function() {

    if (
      document.visibilityState ===
      "visible"
    ) {

      setTimeout(
        function() {

          map.invalidateSize();

        },
        200
      );

    }

  }
);


</script>

</body>

</html>
